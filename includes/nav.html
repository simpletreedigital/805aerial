<style>
.gnav{position:sticky;top:0;z-index:100;background:#0b1220;border-bottom:1px solid rgba(255,255,255,.08)}
.gnav-inner{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1.25rem}
.gnav-brand{display:flex;align-items:center;gap:.6rem;color:#fff;font-weight:700;font-size:1.15rem;text-decoration:none;background:#fff;padding:.4rem .7rem;border-radius:8px}
.gnav-brand img{display:block;height:24px;width:auto}
.gnav-links{display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap}
.gnav-links a{color:#d7dce6;text-decoration:none;font-size:.95rem;font-weight:500}
.gnav-links a.active,.gnav-links a:hover{color:#fff}
.gnav-item{position:relative}
.gnav-item>button{background:none;border:none;color:#d7dce6;font-size:.95rem;font-weight:500;display:flex;align-items:center;gap:.35rem;cursor:pointer;font-family:inherit}
.gnav-item>button:hover{color:#fff}
.gnav-drop{position:absolute;top:100%;left:0;background:#111a2b;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:.5rem;min-width:240px;display:none;flex-direction:column;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.gnav-item.open .gnav-drop{display:flex}
.gnav-drop a{padding:.55rem .7rem;border-radius:6px;white-space:nowrap}
.gnav-drop a:hover{background:rgba(255,255,255,.06)}
.gnav-cta{background:#d4a437;color:#101625!important;padding:.55rem 1.1rem;border-radius:8px;font-weight:700}
.gnav-burger{display:none;background:none;border:none;color:#fff;cursor:pointer}
@media (max-width:900px){
  .gnav-burger{display:block}
  .gnav-links{position:absolute;top:100%;left:0;right:0;background:#0b1220;flex-direction:column;align-items:flex-start;padding:1rem 1.25rem;display:none;gap:.8rem}
  .gnav-links.open{display:flex}
  .gnav-drop{position:static;display:flex;margin-top:.3rem}
  .gnav-item.open .gnav-drop{display:flex}
  .gnav-item:not(.open) .gnav-drop{display:none}
}
</style>
<script>
function toggleDrop(id) {
  var items = document.querySelectorAll('.gnav-item');
  items.forEach(function(item) {
    if (item.id === id) {
      var isOpen = item.classList.contains('open');
      item.classList.toggle('open', !isOpen);
      var btn = item.querySelector('button');
      if (btn) btn.setAttribute('aria-expanded', String(!isOpen));
    } else {
      item.classList.remove('open');
      var btn = item.querySelector('button');
      if (btn) btn.setAttribute('aria-expanded', 'false');
    }
  });
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('.gnav-item')) {
    document.querySelectorAll('.gnav-item.open').forEach(function(item) {
      item.classList.remove('open');
      var btn = item.querySelector('button');
      if (btn) btn.setAttribute('aria-expanded', 'false');
    });
  }
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.querySelectorAll('.gnav-item.open').forEach(function(item) {
      item.classList.remove('open');
      var btn = item.querySelector('button');
      if (btn) btn.setAttribute('aria-expanded', 'false');
    });
  }
});
</script>
